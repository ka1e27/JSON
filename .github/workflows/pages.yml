# Publishes the game to GitHub Pages.
#
# enablement: true lets configure-pages create the Pages site itself, so this
# works without anyone opening Settings -> Pages. It does still need the repo to
# be public (or the account to be on a paid plan) -- Pages is not available for
# private repos on the free tier, and the deploy fails with a plan error if so.
#
# Only index.html is staged into _site, so the workflow file and the README are
# not published alongside the game.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
