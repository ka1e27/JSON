# Publishes the game to GitHub Pages via Actions.
#
# YOU PROBABLY DO NOT NEED THIS. index.html sits at the repo root, so the
# simplest route is Settings -> Pages -> Source: "Deploy from a branch",
# main / (root). That needs no Actions permissions at all and republishes on
# every push to main.
#
# This workflow is the alternative for when you want a build step later
# (minifying, splitting the file, generating a preview image). It is
# MANUAL-ONLY on purpose: run 1 of it failed with
#   Create Pages site failed. Error: Resource not accessible by integration
# because GITHUB_TOKEN was refused pages:write. Triggering on push would have
# meant a failure email on every commit to main. Before dispatching it, set
# Settings -> Actions -> General -> Workflow permissions to
# "Read and write permissions", or enable Pages with source "GitHub Actions"
# first so configure-pages has nothing left to create.
#
# Either route also needs the repo to be public, unless the account is on a
# paid plan -- Pages is not offered for private repos on the free tier.
#
# Only index.html is staged into _site, so this file and the README are not
# served alongside the game.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
